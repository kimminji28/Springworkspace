<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/"
 	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  	  layout:decorate="~{common/layouts/dafault_layout}"
  	  layout:fragment="Content">
<head>
<meta charset="UTF-8">
<title></title>
</head>
<body>
	<div class="container text-center">
		<h3>게시글 목록</h3>
		<table class="table">
			<thead>
				<tr>
					<th>번호</th>
					<th>제목</th>
					<th>작성자</th>
					<th>작성일</th> <!-- yyyy년MM월dd일 -->
				</tr>
			</thead>
			<tbody>
				<th:block th:each="info : ${boards}">
					<tr th:onclick="|location.href='@{/boardInfo(bno=${info.bno})}'|">
						<td>[[ ${info.bno} ]]</td>
						<td>[[ ${info.title} ]]</td>
						<td>[[ ${info.writer} ]]</td>
						<td>[[ ${#dates.format(info.regdate, 'yyyy년MM월dd일')} ]]</td>
					</tr>
				</th:block>
			</tbody>
		</table>
	</div>
</body>
</html>
