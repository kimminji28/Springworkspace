<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org/"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{common/layouts/dafault_layout}"
  layout:fragment="Content"
>
  <head>
    <meta charset="UTF-8" />
    <title></title>
  </head>
  <body>
    <script>
      document.addEventListener("DOMContentLoaded", function (event) {
        //DOM이 완성되고 난 후 해당 코드를 수행
        document
          .querySelector("form")
          .addEventListener("submit", boardInsertAjax);
      });

      function boardInsertAjax(event) {
        event.preventDefault();
        let formTag = event.currentTarget;

        //제목
        let titleTag = formTag.querySelector('[name="title"]');
        if (titleTag.value == "") {
          alert("제목을 작성해주세요.");
          titleTag.focus();
          return;
        }

        //작성자
        let writerTag = formTag.querySelector('[name="writer"]');
        if (writerTag.value == "") {
          alert("작성자를 입력해주세요.");
          writerTag.focus();
          return;
        }

        //작성일자
        let regdtTag = formTag.querySelector('[name="regdate"]');
        if (regdtTag.value == "") {
          alert("작성일자를 입력해주세요.");
          regdtTag.focus();
          return;
        }

        alert("게시글이 등록되었습니다.");
        formTag.submit();
      }
    </script>
    <div class="container text-center">
      <form th:action="@{/boardInsert}" method="post">
        <h3>게시글 등록</h3>
        <div class="row">
          <div class="col-4 col-form-label">제목</div>
          <div class="col-8"><input type="text" name="title" /></div>
        </div>
        <div class="row">
          <div class="col-4 col-form-label">작성자</div>
          <div class="col-8"><input type="text" name="writer" /></div>
        </div>
        <div class="row">
          <div class="col-4 col-form-label">내용</div>
          <div class="col-8"><textarea row="3" name="contents"></textarea></div>
        </div>
        <div class="row">
          <div class="col-4 col-form-label">첨부파일</div>
          <div class="col-8">
            <input type="text" name="image" />
          </div>
        </div>
        <div class="row">
          <!-- yyyy/MM/dd -->
          <div class="col-4 col-form-label">작성일자</div>
          <div class="col-8"><input type="date" name="regdate" /></div>
        </div>
        <div>
          <button type="submit" class="btn btn-primary" >등록</button>
        </div>
      </form>
    </div>
  </body>
</html>
