<!doctype html>
<html xmlns:th="https://www.thymeleaf.org/">
  <head>
    <meta charset="UTF-8" />
    <title>Form 방식</title>
  </head>
  <body>
    <form
      th:action="@{/uploadForm}"
      method="post"
      enctype="multipart/form-data"
    >
      <input type="file" name="file" />
      <button type="submit">저장</button>
    </form>

    <form name="uploadForm">
      <input type="file" name="uploads" multiple />
      <button type="button">다중 업로드</button>
    </form>
    <script>
      uploadForm
        .querySelector("button")
        .addEventListener("click", function (event) {
          //1) 서버에 전송할 데이터
          let formDta = new FormData(uploadForm);

          //2) 해당 데이터를 서버에 전송
          fetch(`uploadAjax`, {
            method: "post",
            body: formDta,
          })
            .then((res) => res.json())
            .then((result) => {
              console.log(result);
            })
            .catch((err) => console.log(err));
        });
    </script>
  </body>
</html>
