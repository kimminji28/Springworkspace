<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
<meta charset="UTF-8">
<title>common html</title>
</head>
<body>
	<h1>타임리프</h1>
	<!--/* #으로 시작하는 객체는 타임리프가 가지고있는 내장객체임 */-->
	<!--/* th:block : 한 번 사용되면 사라짐 / th:each : 반복문 =>
		 li태그에 한번에 다 들어갈 수 없어서 th:block th:each 얘들이 한 쌍 */-->
	<ul>
		<th:block th:each="num : ${#numbers.sequence(1, 10)}">
			<li>[[ ${num} ]]</li>
		</th:block>
	</ul>
	<!--/* ${}, 변수표현식 => 가장 많이 쓰는 표현식*/-->
	<!--/* ***핵심***
		1. Controller에서 Model 객체의 페이지에서 사용할 데이터를 담음
		2. => thymeleaf에서 사용할 변수
		3. thymeleaf에선 ${}(변수표현식)을 이용해서 해당 데이터를 사용
		4. th:속성="${변수명}" 방식으로 기본 사용
		
		변수명 : model.addAttribute에서 받은 객체만 사용 가능
			   ex) list / info (key=value 중 key)
	 */-->
	 <h2>특정 사원 정보</h2>
	 <!--/* Mybatis를 활용해서 필드명을 사용하고, 그럼 자동으로 getter 불러냄 */-->
	 <div>
	 	<p th:text="${info.employeeId}"></p>
	 	<label> [[ ${info.lastName} ]], 
	 		<input th:value="${info.firstName}">
	 	</label>
	 </div>
	 <!--/*
	 	th:if와 th:each는 태그 생성에 관여
	 	</th:block> : thymeleaf의 유일한 태그
	 	
	 	[] : 문법에서의 []대괄호는 생략가능함
	 	상태값 : index 0부터 시작, count 1부터 시작, odd 홀수, even 짝수,
	 		   first 첫번째값, last 마지막값, current, size
	 	
	 	[0, 1, 2, 3, 4, 5] : 여기서 짝수랑 홀수는 count/index별로 다름
	 	
	 	<th:block th:each="임시변수[, 상태값(status)] : ${변수명(배열타입)}">
	 		<태그 th:속성="${임시변수}"></태그>
	 	</th:block>
	  */-->
	  
	  <th:block th:each="emp, status : ${list}">
	  		<ul th:if="${status.count <= 10}">
	  			<li>[[ ${status.count} ]]</li>
	  			<li name="사원번호">[[ ${emp.employeeId} ]]</li>
	  			<li name="사원이름">[[ ${emp.lastName} ]]</li>
	  			<li name="입사일">[[ ${#dates.format(emp.hireDate, 'yyyy년MM월dd일')} ]]</li>
	  		</ul>
	  </th:block>
</body>
</html>
