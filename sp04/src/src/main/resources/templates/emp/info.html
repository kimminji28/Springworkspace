<!doctype html>
<html xmlns:th="https://www.thymeleaf.org/">
  <head>
  <meta charset="UTF-8" />
  <title>Insert title here</title>
  <th:block th:replace="~{commom/config/default_configs :: BootstrapConfig}"></th:block>
  </head>
  <body>
    <div class="container text-center">
      <h3>사원 상세 조회</h3>
      <div>
        <div>
          <label for="eid">사원번호</label>
          <input id="eid" type="text" th:value="${emp.employeeId}" readonly />
        </div>
        <div>
          <label for="ename">이름</label>
          <input id="ename" type="text" th:value="${emp.lastName}" readonly />
        </div>
        <div>
          <label for="email">이메일</label>
          <input id="email" type="email" th:value="${emp.email}" readonly />
        </div>
        <div>
          <label for="hdate">입사일</label>
          <input
            id="hdate"
            type="date"
            th:value="${#dates.format(emp.hireDate, 'yyyy-MM-dd')}"
            readonly
          />
        </div>
        <div>
          <label for="job">업무</label>
          <input id="job" type="text" th:value="${emp.jobId}" readonly />
        </div>
        <div>
          <label for="sal">급여</label>
          <input
            id="sal"
            type="number"
            step="0.01"
            th:value="${emp.salary}"
            readonly
          />
        </div>
        <div>
          <button type="button" class="btn btn-info" th:onclick="|location.href='@{/empUpdate(employeeId=${emp.employeeId})}'|">수정</button>
          <button type="button" class="btn btn-success" th:onclick="|location.href ='@{/empList}'|">목록</button>
          <button type="button" class="btn btn-danger" th:onclick="|location.href='@{/empDelete(empId=${emp.employeeId})}'|">삭제</button>
        </div>
      </div>
    </div>
  </body>
</html>
